name: checkout-pricing-inventory
target_p95_ms: 220

services:
  gateway:
    latency_ms: 10
    depends_on: []
  checkout:
    latency_ms: 30
    depends_on:
      - gateway
  pricing:
    latency_ms: 60
    depends_on:
      - checkout
  inventory:
    latency_ms: 80
    depends_on:
      - pricing
  payment:
    latency_ms: 70
    depends_on:
      - inventory
  response:
    latency_ms: 10
    depends_on:
      - payment

parallelization_candidates:
  - name: pricing-inventory
    services:
      - pricing
      - inventory
    common_dependency: checkout
